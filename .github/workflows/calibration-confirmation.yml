name: Stockfish calibration confirmation

on:
  workflow_dispatch:

concurrency:
  group: calibration-confirmation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Check out evaluation configuration
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build confirmation matrix from the checked-in proposal
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(
            jq --compact-output '
              .calibration.confirmation as $confirmation
              | ($confirmation.openingPairs / $confirmation.pairsPerShard) as $shard_count
              | {
                  include: [
                    $confirmation.mapping[] as $mapping
                    | range(0; $shard_count) as $shard_index
                    | {
                        preset: $mapping.preset,
                        arasan_elo: $mapping.arasanElo,
                        block: ($shard_index + 1),
                        opening_start: (1 + $shard_index * $confirmation.pairsPerShard),
                        opening_pairs: $confirmation.pairsPerShard
                      }
                  ]
                }
            ' evaluation/sixtyfour-strength.json
          )"
          test "$(jq '.include | length' <<< "${matrix}")" -gt 0
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out Arasan SDK
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Initialize engine dependency
        shell: bash
        run: git submodule update --init src/syzygy

      - name: Build native Arasan engine
        shell: bash
        run: make -C src -j"$(nproc)" BUILD_TYPE=modern

      - name: Check out pinned Stockfish 19
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: official-stockfish/Stockfish
          ref: edb0d9db6731067ec50ce619ff372b463bc4dd5d
          path: .evaluation-tools/stockfish
          persist-credentials: false

      - name: Build Stockfish reference
        shell: bash
        run: make -C .evaluation-tools/stockfish/src -j"$(nproc)" profile-build ARCH=x86-64

      - name: Check out pinned fastchess
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Disservin/fastchess
          ref: 60d7a7a26c6b0582a15c112fb29a1829bef2adb3
          path: .evaluation-tools/fastchess
          persist-credentials: false

      - name: Build fastchess
        shell: bash
        run: make -C .evaluation-tools/fastchess -j"$(nproc)" build=release

      - name: Verify configured Stockfish pin
        shell: bash
        run: |
          set -euo pipefail
          configured_revision="$(jq --raw-output '.calibration.reference.revision' evaluation/sixtyfour-strength.json)"
          built_revision="$(git -C .evaluation-tools/stockfish rev-parse HEAD)"
          test "${built_revision}" = "${configured_revision}"

      - name: Stage identical runner tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/calibration-tools
          cp bin/arasanx-64-modern artifacts/calibration-tools/arasanx-64-modern
          cp .evaluation-tools/stockfish/src/stockfish artifacts/calibration-tools/stockfish-19
          cp .evaluation-tools/fastchess/fastchess artifacts/calibration-tools/fastchess

      - name: Upload runner tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arasan-calibration-confirmation-tools-${{ github.sha }}
          path: artifacts/calibration-tools
          if-no-files-found: error
          retention-days: 1

  match:
    name: Confirm ${{ matrix.preset }} input ${{ matrix.arasan_elo }}, block ${{ matrix.block }}
    needs: [plan, tools]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Check out evaluation code and test data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download runner tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arasan-calibration-confirmation-tools-${{ github.sha }}
          path: artifacts/calibration-tools

      - name: Prepare runner tools
        shell: bash
        run: |
          set -euo pipefail
          chmod +x artifacts/calibration-tools/arasanx-64-modern
          chmod +x artifacts/calibration-tools/stockfish-19
          chmod +x artifacts/calibration-tools/fastchess
          network_path="$(jq --raw-output '.network.sourcePath' sdk/upstream.json)"
          ln --symbolic --force \
            "${GITHUB_WORKSPACE}/${network_path}" \
            "artifacts/calibration-tools/$(basename "${network_path}")"

      - name: Run one disjoint opening block
        shell: bash
        run: |
          set -euo pipefail
          results_path="artifacts/calibration-confirmation-shards/${{ matrix.preset }}-block-${{ matrix.block }}"
          mkdir -p "${results_path}"
          python3 evaluation/run_calibration_eval.py run \
            --fastchess artifacts/calibration-tools/fastchess \
            --arasan artifacts/calibration-tools/arasanx-64-modern \
            --arasan-directory artifacts/calibration-tools \
            --reference artifacts/calibration-tools/stockfish-19 \
            --reference-directory artifacts/calibration-tools \
            --output-directory "${results_path}" \
            --opening-pairs "${{ matrix.opening_pairs }}" \
            --opening-order sequential \
            --opening-start "${{ matrix.opening_start }}" \
            --concurrency "$(nproc)" \
            --preset "${{ matrix.preset }}" \
            --arasan-elo "${{ matrix.arasan_elo }}" \
            > "${results_path}/console.log" 2>&1

      - name: Upload confirmation block
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arasan-calibration-confirmation-${{ matrix.preset }}-b${{ matrix.block }}-${{ github.sha }}
          path: artifacts/calibration-confirmation-shards
          if-no-files-found: error
          retention-days: 1

  report:
    if: ${{ !cancelled() }}
    needs: [plan, tools, match]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out evaluation tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download confirmation blocks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: arasan-calibration-confirmation-*-b*-${{ github.sha }}
          path: artifacts/calibration-confirmation-shards

      - name: Combine the complete 200-pair confirmation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shard_paths < <(
            find artifacts/calibration-confirmation-shards \
              -type f -name manifest.json -printf '%h\n' | sort
          )
          python3 evaluation/merge_calibration_confirmation.py \
            artifacts/calibration-confirmation \
            "${shard_paths[@]}"

      - name: Require every proposed level to pass
        shell: bash
        run: |
          python3 evaluation/summarize_calibration_eval.py \
            --require-pass \
            artifacts/calibration-confirmation

      - name: Publish confirmation summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f artifacts/calibration-confirmation/summary.md ]]; then
            cat artifacts/calibration-confirmation/summary.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Calibration confirmation did not produce a summary." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload confirmation artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arasan-calibration-confirmation-${{ github.sha }}
          path: artifacts/calibration-confirmation
          if-no-files-found: warn
          retention-days: 90

      - name: Retain failed confirmation diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arasan-calibration-confirmation-diagnostics-${{ github.sha }}
          path: artifacts/calibration-confirmation-shards
          if-no-files-found: warn
          retention-days: 90
