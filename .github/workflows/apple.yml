name: Apple

on:
  push:
    branches: [main, "platform/apple-*"]
    paths:
      - ".github/workflows/apple.yml"
      - "cmake/**"
      - "doc/**"
      - "network/arasanv8-20260622.nnue"
      - "platforms/apple/**"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/apple.yml"
      - "cmake/**"
      - "doc/**"
      - "network/arasanv8-20260622.nnue"
      - "platforms/apple/**"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build and package XCFramework
        shell: bash
        run: ./platforms/apple/build.sh

      - name: Build Swift smoke application
        shell: bash
        run: ./platforms/apple/build-smoke.sh

      - name: Boot iOS simulator
        id: simulator
        shell: bash
        run: |
          simulator_id="$(xcrun simctl list devices available --json | \
            jq --raw-output '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          if [[ -z "${simulator_id}" || "${simulator_id}" == "null" ]]; then
            echo "No available iPhone simulator" >&2
            exit 1
          fi
          xcrun simctl bootstatus "${simulator_id}" -b
          echo "id=${simulator_id}" >> "${GITHUB_OUTPUT}"

      - name: Run simulator smoke suite
        shell: bash
        env:
          ARASAN_SIMULATOR_UDID: ${{ steps.simulator.outputs.id }}
        run: ./platforms/apple/run-smoke.sh

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arasan-chess-sdk-apple
          path: dist/apple
          if-no-files-found: error
          retention-days: 14
