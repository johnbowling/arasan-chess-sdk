name: Evaluation harness

on:
  workflow_call:
  push:
    branches: [main, "evaluation/**", "automation/upstream-*"]
    paths:
      - ".github/workflows/evaluation.yml"
      - "evaluation/**"
      - "src/options.h"
      - "src/search.cpp"
  pull_request:
    paths:
      - ".github/workflows/evaluation.yml"
      - "evaluation/**"
      - "src/options.h"
      - "src/search.cpp"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test evaluation harness
        shell: bash
        run: python3 -m unittest discover -s evaluation -p 'test_*.py'
