name: Evaluation harness

on:
  workflow_call:
    inputs:
      run_strength_gate:
        description: "Run the full 200-pair Algorithm ladder"
        required: false
        default: false
        type: boolean
  push:
    branches: [main, "evaluation/**", "automation/upstream-*"]
    paths:
      - ".github/workflows/evaluation.yml"
      - ".github/workflows/calibration.yml"
      - ".github/workflows/calibration-search.yml"
      - ".github/workflows/calibration-confirmation.yml"
      - ".github/workflows/calibration-extension.yml"
      - "evaluation/**"
      - "src/options.h"
      - "src/search.cpp"
  pull_request:
    paths:
      - ".github/workflows/evaluation.yml"
      - ".github/workflows/calibration.yml"
      - ".github/workflows/calibration-search.yml"
      - ".github/workflows/calibration-confirmation.yml"
      - ".github/workflows/calibration-extension.yml"
      - "evaluation/**"
      - "src/options.h"
      - "src/search.cpp"
  workflow_dispatch:
    inputs:
      run_strength_gate:
        description: "Run the full 200-pair Algorithm ladder"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  harness-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test evaluation harness
        shell: bash
        run: python3 -m unittest discover -s evaluation -p 'test_*.py'

  algorithm-strength-tools:
    if: ${{ inputs.run_strength_gate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source and test data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Initialize engine dependency
        shell: bash
        run: git submodule update --init src/syzygy

      - name: Build native UCI engine
        shell: bash
        run: |
          set -euo pipefail
          make -C src -j"$(nproc)" BUILD_TYPE=modern
          network_path="$(jq --raw-output '.network.sourcePath' sdk/upstream.json)"
          ln --symbolic --force "../${network_path}" "bin/$(basename "${network_path}")"
          test -x bin/arasanx-64-modern

      - name: Check out pinned fastchess
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Disservin/fastchess
          ref: 60d7a7a26c6b0582a15c112fb29a1829bef2adb3
          path: .evaluation-tools/fastchess
          persist-credentials: false

      - name: Build fastchess
        shell: bash
        run: make -C .evaluation-tools/fastchess -j"$(nproc)" build=release

      - name: Stage identical runner tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/strength-tools
          cp bin/arasanx-64-modern artifacts/strength-tools/arasanx-64-modern
          cp .evaluation-tools/fastchess/fastchess artifacts/strength-tools/fastchess

      - name: Upload runner tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arasan-strength-tools-${{ github.sha }}
          path: artifacts/strength-tools
          if-no-files-found: error
          retention-days: 1

  algorithm-strength-match:
    name: Algorithm ${{ matrix.label }}
    if: ${{ inputs.run_strength_gate }}
    needs: algorithm-strength-tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - pair: casual:club
            artifact_id: casual-vs-club
            label: Casual → Club
          - pair: club:strong-club
            artifact_id: club-vs-strong-club
            label: Club → Strong club
          - pair: strong-club:expert
            artifact_id: strong-club-vs-expert
            label: Strong club → Expert
          - pair: expert:master
            artifact_id: expert-vs-master
            label: Expert → Master
          - pair: master:elite
            artifact_id: master-vs-elite
            label: Master → Elite
          - pair: elite:maximum
            artifact_id: elite-vs-maximum
            label: Elite → Maximum
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out source and test data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download runner tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arasan-strength-tools-${{ github.sha }}
          path: artifacts/strength-tools

      - name: Prepare runner tools
        shell: bash
        run: |
          set -euo pipefail
          chmod +x artifacts/strength-tools/arasanx-64-modern
          chmod +x artifacts/strength-tools/fastchess
          network_path="$(jq --raw-output '.network.sourcePath' sdk/upstream.json)"
          ln --symbolic --force \
            "${GITHUB_WORKSPACE}/${network_path}" \
            "artifacts/strength-tools/$(basename "${network_path}")"

      - name: Run 200-pair Algorithm match
        shell: bash
        run: |
          set -euo pipefail
          results_path="artifacts/strength-evaluation"
          mkdir -p "${results_path}"
          python3 evaluation/run_strength_eval.py run \
            --fastchess artifacts/strength-tools/fastchess \
            --engine artifacts/strength-tools/arasanx-64-modern \
            --engine-directory artifacts/strength-tools \
            --output-directory "${results_path}" \
            --opening-pairs 200 \
            --concurrency "$(nproc)" \
            --lane algorithm \
            --pair "${{ matrix.pair }}" \
            > "${results_path}/console.log" 2>&1

      - name: Upload match shard
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arasan-strength-shard-${{ matrix.artifact_id }}-${{ github.sha }}
          path: artifacts/strength-evaluation
          if-no-files-found: error
          retention-days: 1

  algorithm-strength-gate:
    if: ${{ !cancelled() && inputs.run_strength_gate }}
    needs: [algorithm-strength-tools, algorithm-strength-match]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out evaluation tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download match shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: arasan-strength-shard-*-${{ github.sha }}
          path: artifacts/strength-evaluation-shards

      - name: Merge match shards
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shard_paths < <(
            find artifacts/strength-evaluation-shards \
              -mindepth 1 -maxdepth 1 -type d -print | sort
          )
          python3 evaluation/merge_strength_eval.py \
            --require-complete-ladder \
            artifacts/strength-evaluation \
            "${shard_paths[@]}"

      - name: Require a passing evaluation
        shell: bash
        run: python3 evaluation/summarize_strength_eval.py --require-pass artifacts/strength-evaluation

      - name: Publish evaluation summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f artifacts/strength-evaluation/summary.md ]]; then
            cat artifacts/strength-evaluation/summary.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Strength evaluation did not produce a summary." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload evaluation artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arasan-strength-evaluation-${{ github.sha }}
          path: artifacts/strength-evaluation
          if-no-files-found: warn
          retention-days: 90

      - name: Retain failed shard diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arasan-strength-shard-diagnostics-${{ github.sha }}
          path: artifacts/strength-evaluation-shards
          if-no-files-found: warn
          retention-days: 90
