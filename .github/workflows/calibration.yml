name: Stockfish-anchored calibration

on:
  workflow_dispatch:
    inputs:
      opening_pairs:
        description: "Paired openings per preset (200 is the checked-in full study)"
        required: true
        default: 50
        type: number

concurrency:
  group: calibration-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out Arasan SDK
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Initialize engine dependency
        shell: bash
        run: git submodule update --init src/syzygy

      - name: Build native Arasan engine
        shell: bash
        run: make -C src -j"$(nproc)" BUILD_TYPE=modern

      - name: Check out pinned Stockfish 19
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: official-stockfish/Stockfish
          ref: edb0d9db6731067ec50ce619ff372b463bc4dd5d
          path: .evaluation-tools/stockfish
          persist-credentials: false

      - name: Build Stockfish reference
        shell: bash
        run: make -C .evaluation-tools/stockfish/src -j"$(nproc)" profile-build ARCH=x86-64

      - name: Check out pinned fastchess
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Disservin/fastchess
          ref: 60d7a7a26c6b0582a15c112fb29a1829bef2adb3
          path: .evaluation-tools/fastchess
          persist-credentials: false

      - name: Build fastchess
        shell: bash
        run: make -C .evaluation-tools/fastchess -j"$(nproc)" build=release

      - name: Verify configured Stockfish pin
        shell: bash
        run: |
          set -euo pipefail
          configured_revision="$(jq --raw-output '.calibration.reference.revision' evaluation/sixtyfour-strength.json)"
          built_revision="$(git -C .evaluation-tools/stockfish rev-parse HEAD)"
          test "${built_revision}" = "${configured_revision}"

      - name: Stage identical runner tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/calibration-tools
          cp bin/arasanx-64-modern artifacts/calibration-tools/arasanx-64-modern
          cp .evaluation-tools/stockfish/src/stockfish artifacts/calibration-tools/stockfish-19
          cp .evaluation-tools/fastchess/fastchess artifacts/calibration-tools/fastchess

      - name: Upload runner tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arasan-calibration-tools-${{ github.sha }}
          path: artifacts/calibration-tools
          if-no-files-found: error
          retention-days: 1

  match:
    name: Calibrate ${{ matrix.label }}
    needs: tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: casual
            label: Casual 1320
          - preset: club
            label: Club 1600
          - preset: strong-club
            label: Strong club 1900
          - preset: expert
            label: Expert 2200
          - preset: master
            label: Master 2500
          - preset: elite
            label: Elite 2800
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out evaluation code and test data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download runner tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arasan-calibration-tools-${{ github.sha }}
          path: artifacts/calibration-tools

      - name: Prepare runner tools
        shell: bash
        run: |
          set -euo pipefail
          chmod +x artifacts/calibration-tools/arasanx-64-modern
          chmod +x artifacts/calibration-tools/stockfish-19
          chmod +x artifacts/calibration-tools/fastchess
          network_path="$(jq --raw-output '.network.sourcePath' sdk/upstream.json)"
          ln --symbolic --force \
            "${GITHUB_WORKSPACE}/${network_path}" \
            "artifacts/calibration-tools/$(basename "${network_path}")"

      - name: Run paired calibration match
        shell: bash
        run: |
          set -euo pipefail
          results_path="artifacts/calibration-evaluation"
          mkdir -p "${results_path}"
          python3 evaluation/run_calibration_eval.py run \
            --fastchess artifacts/calibration-tools/fastchess \
            --arasan artifacts/calibration-tools/arasanx-64-modern \
            --arasan-directory artifacts/calibration-tools \
            --reference artifacts/calibration-tools/stockfish-19 \
            --reference-directory artifacts/calibration-tools \
            --output-directory "${results_path}" \
            --opening-pairs "${{ inputs.opening_pairs }}" \
            --concurrency "$(nproc)" \
            --preset "${{ matrix.preset }}" \
            > "${results_path}/console.log" 2>&1

      - name: Upload calibration shard
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arasan-calibration-shard-${{ matrix.preset }}-${{ github.sha }}
          path: artifacts/calibration-evaluation
          if-no-files-found: error
          retention-days: 1

  report:
    if: ${{ !cancelled() }}
    needs: [tools, match]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out evaluation tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download calibration shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: arasan-calibration-shard-*-${{ github.sha }}
          path: artifacts/calibration-evaluation-shards

      - name: Merge calibration shards
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shard_paths < <(
            find artifacts/calibration-evaluation-shards \
              -mindepth 1 -maxdepth 1 -type d -print | sort
          )
          python3 evaluation/merge_calibration_eval.py \
            --require-complete-calibration \
            artifacts/calibration-evaluation \
            "${shard_paths[@]}"

      - name: Require equivalent anchored levels
        shell: bash
        run: python3 evaluation/summarize_calibration_eval.py --require-pass artifacts/calibration-evaluation

      - name: Publish calibration summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f artifacts/calibration-evaluation/summary.md ]]; then
            cat artifacts/calibration-evaluation/summary.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Calibration did not produce a summary." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload calibration artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arasan-calibration-evaluation-${{ github.sha }}
          path: artifacts/calibration-evaluation
          if-no-files-found: warn
          retention-days: 90

      - name: Retain failed shard diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arasan-calibration-shard-diagnostics-${{ github.sha }}
          path: artifacts/calibration-evaluation-shards
          if-no-files-found: warn
          retention-days: 90
